<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marselo (the site)</title>
    <link rel="icon" type="image/jpeg" href="marselopic.jpg">
    <style>
        /* Center all content on the page */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
            background-color: #f0f0f0;
            text-align: center;
        }

        /* Comic Sans font and basic styling for the heading */
        h1 {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            font-size: 3rem;
            margin-bottom: 30px;
            /* Apply the rainbow animation */
            animation: rainbowColors 4s linear infinite;
        }

        /* Keyframes for smooth rainbow color cycling */
        @keyframes rainbowColors {
            0%   { color: #ff0000; } /* Red */
            15%  { color: #ff7f00; } /* Orange */
            30%  { color: #ffff00; } /* Yellow */
            45%  { color: #00ff00; } /* Green */
            60%  { color: #0000ff; } /* Blue */
            75%  { color: #4b0082; } /* Indigo */
            90%  { color: #9400d3; } /* Violet */
            100% { color: #ff0000; } /* Back to Red */
        }

        /* Stretches the image to a 16:9 aspect ratio */
        .stretched-image {
            width: 90vw;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            object-fit: fill; /* Forces the image to stretch and ignore its original proportions */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px; /* Slight rounding for aesthetics */
        }

        /* Canvas that sits on top of the page and draws the cursor trail */
        #trail {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* never blocks clicks */
            z-index: 9999;
        }

        /* ---------- Little guy assistant ---------- */
        #pal {
            position: fixed;
            right: 12px;
            bottom: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            text-align: left;
        }
        #pal button, #pal input { font-family: inherit; }
        #pal :focus-visible { outline: 3px solid #4b0082; outline-offset: 2px; }

        #panel {
            width: min(310px, calc(100vw - 24px));
            max-height: 60vh;
            overflow-y: auto;
            background: #fff;
            border: 3px solid #222;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 4px 4px 0 #222;
        }
        #panel[hidden] { display: none; }
        #panel h2 { margin: 0 0 8px; font-size: 1rem; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .chip {
            border: 2px solid #222;
            background: #fff;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .chip:hover { background: #ffee58; }
        .chip:active { transform: translateY(1px); }
        .say-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .say-row input {
            flex: 1;
            min-width: 0;
            border: 2px solid #222;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.9rem;
        }
        .setting { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; font-size: 0.9rem; }
        .setting input[type="range"] { width: 130px; }
        .setting select { max-width: 170px; font-family: inherit; font-size: 0.85rem; border: 2px solid #222; border-radius: 8px; padding: 3px 4px; background: #fff; }

        #bubble {
            position: relative;
            max-width: 250px;
            background: #fff;
            border: 3px solid #222;
            border-radius: 18px;
            padding: 10px 14px;
            margin-right: 18px;
            font-size: 1rem;
            line-height: 1.35;
            box-shadow: 4px 4px 0 #222;
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px) scale(0.95);
            transform-origin: bottom right;
            transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
            pointer-events: none;
        }
        #bubble.show { opacity: 1; visibility: visible; transform: none; }
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -11px;
            right: 26px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-right: 3px solid #222;
            border-bottom: 3px solid #222;
            transform: rotate(45deg);
        }

        .guy-row { position: relative; }
        #guyBtn {
            display: block;
            width: 110px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            transform-origin: bottom center;
            -webkit-tap-highlight-color: transparent;
        }
        #guyBtn img {
            display: block;
            width: 100%;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: bottom center;
            animation: bob 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25));
        }
        #pal.talking #guyBtn img { animation: yap 0.28s ease-in-out infinite; }
        #guyBtn:hover img { animation: wiggle 0.4s ease-in-out infinite; }
        #guyBtn:active { transform: scale(0.94); }
        #chatToggle {
            position: absolute;
            left: -62px;
            bottom: 10px;
            border: 2px solid #222;
            background: #ffee58;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 0 #222;
        }
        #chatToggle:hover { background: #fff; }

        @keyframes bob    { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
        @keyframes yap    { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.07, 0.93); } }
        @keyframes wiggle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

        @media (max-width: 1100px) {
            body { box-sizing: border-box; padding-bottom: 190px; }
        }
        @media (max-width: 500px) {
            #guyBtn { width: 88px; }
            #chatToggle { left: -58px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #guyBtn img, #pal.talking #guyBtn img, #guyBtn:hover img { animation: none; }
            #bubble { transition: none; }
        }

        /* ---------- Combat mode ---------- */
        #combatBtn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1100;
            border: 3px solid #222;
            background: #ff5252;
            color: #fff;
            border-radius: 999px;
            padding: 8px 16px;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 #222;
        }
        #combatBtn:hover { background: #ff1744; }
        #combatBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #222; }
        #combatBtn:focus-visible { outline: 3px solid #4b0082; outline-offset: 2px; }

        #arena {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: #1a1a2e;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            user-select: none;
            -webkit-user-select: none;
        }
        #arena[hidden] { display: none; }
        #arenaCv {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: default;
            display: block;
        }
        .arena-btn {
            position: absolute;
            top: 12px;
            border: 3px solid #222;
            background: #fff;
            border-radius: 999px;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 #222;
            z-index: 2;
        }
        .arena-btn:hover { background: #ffee58; }
        .arena-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #222; }
        .arena-btn:focus-visible { outline: 3px solid #4b0082; outline-offset: 2px; }
        #arenaExit { left: 12px; background: #ffee58; }
        #arenaReset { right: 12px; }
        #arenaSound { right: 96px; }
        #arenaHits {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 3px solid #222;
            border-radius: 999px;
            padding: 4px 16px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
            pointer-events: none;
            white-space: nowrap;
        }
        #toolbar {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            max-width: calc(100vw - 16px);
            padding: 8px;
            background: rgba(255,255,255,0.92);
            border: 3px solid #222;
            border-radius: 18px;
            box-shadow: 4px 4px 0 #222;
            z-index: 2;
        }
        .tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 74px;
            padding: 4px 2px 3px;
            border: 3px solid transparent;
            border-radius: 12px;
            background: #f4f4f4;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .tool canvas { width: 54px; height: 54px; pointer-events: none; }
        .tool:hover { background: #fff7c2; }
        .tool.sel { border-color: #ff1744; background: #ffe0e0; }
        .tool:focus-visible { outline: 3px solid #4b0082; outline-offset: 2px; }
        @media (max-width: 600px) {
            .tool { width: 52px; font-size: 0.62rem; }
            .tool canvas { width: 38px; height: 38px; }
            #toolbar { gap: 4px; padding: 6px; }
            #arenaSound { right: 84px; }
            .arena-btn { padding: 5px 10px; font-size: 0.85rem; }
        }
        /* ---------- Sandbox UI: gravity, slow-mo, hints ---------- */
        #physPanel {
            position: absolute;
            top: 58px;
            left: 12px;
            width: 218px;
            padding: 8px 10px 10px;
            background: rgba(255,255,255,0.94);
            border: 3px solid #222;
            border-radius: 14px;
            box-shadow: 3px 3px 0 #222;
            font-size: 0.82rem;
            z-index: 2;

        #physPanel .row b { font-size: 0.95rem; }
        #gravName { font-size: 0.75rem; color: #555; }
        #gravSlider { width: 100%; margin: 6px 0 4px; accent-color: #ff1744; }
        #physPanel .presets { display: flex; gap: 4px; margin: 2px 0 8px; }
        #physPanel .chip { flex: 1; padding: 2px 4px; font-size: 0.72rem; border: 2px solid #222; background: #fff; border-radius: 999px; font-family: inherit; cursor: pointer; }
        #physPanel .chip:hover { background: #ffee58; }
        #slowBtn {
            width: 100%;
            border: 2px solid #222;
            background: #fff;
            border-radius: 10px;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }
        #slowBtn:hover { background: #e3f2fd; }
        #slowBtn.on { background: #82b1ff; }
        #slowBtn kbd { border: 2px solid #222; border-radius: 5px; padding: 0 5px; background: #fff; font-family: inherit; font-size: 0.75rem; }
        #slowBadge {
            position: absolute;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            background: #82b1ff;
            border: 3px solid #222;
            border-radius: 999px;
            padding: 3px 14px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 3px 3px 0 #222;
            pointer-events: none;
            z-index: 2;
        }
        #slowBadge[hidden] { display: none; }
        #arenaHint {
            position: absolute;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%);
            max-width: calc(100vw - 24px);
            padding: 4px 14px;
            background: rgba(255,255,255,0.88);
            border: 2px solid #222;
            border-radius: 999px;
            font-size: 0.82rem;
            text-align: center;
            pointer-events: none;
            z-index: 2;
        }
        #arenaHint b { border: 2px solid #222; border-radius: 5px; padding: 0 4px; background: #ffee58; font-size: 0.78rem; }
        #touchCtl { display: none; position: absolute; right: 10px; bottom: 150px; gap: 8px; z-index: 3; }
        #touchCtl button {
            width: 54px; height: 54px;
            border: 3px solid #222; border-radius: 50%;
            background: #fff; font-family: inherit; font-size: 1.1rem; font-weight: bold;
            box-shadow: 3px 3px 0 #222; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #touchCtl button[data-key="f"] { background: #ff5252; color: #fff; }
        #touchCtl button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #222; }
        @media (pointer: coarse) { #touchCtl { display: flex; } }
        @media (max-width: 600px) {
            #physPanel { width: 168px; top: 52px; font-size: 0.74rem; padding: 6px 8px 8px; }
            #physPanel .presets { display: none; }
            #arenaHint { bottom: 94px; font-size: 0.7rem; }
            #slowBadge { top: 52px; }
        }
        @media (prefers-reduced-motion: reduce) { #slowBadge { transition: none; } }
    </style>
</head>

    <!-- Rainbow cursor trail -->

    <script>
        (function () {
            // Skip the effect for people who prefer reduced motion
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            var canvas = document.getElementById('trail');
            var ctx = canvas.getContext('2d');
            var points = [];
            var LIFETIME = 700;   // how long (ms) each trail point lasts
            var MAX_WIDTH = 7;    // thickest part of the trail, near the cursor
            var running = false;

            function resize() {
                var dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            // Works for mouse, pen and touch
            window.addEventListener('pointermove', function (e) {
                points.push({ x: e.clientX, y: e.clientY, t: performance.now() });
                if (!running) {
                    running = true;
                    requestAnimationFrame(draw);
                }
            });

            function draw(now) {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                // Drop points that have faded out
                while (points.length && now - points[0].t > LIFETIME) points.shift();

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (var i = 1; i < points.length; i++) {
                    var a = points[i - 1];
                    var b = points[i];
                    var life = 1 - (now - b.t) / LIFETIME; // 1 = fresh, 0 = gone

                    // Hue is tied to when the point was made, so the colors
                    // run along the trail like a rainbow and keep shifting.
                    var hue = (b.t * 0.35) % 360;

                    ctx.strokeStyle = 'hsla(' + hue + ', 100%, 55%, ' + life + ')';
                    ctx.lineWidth = Math.max(1, MAX_WIDTH * life);
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                }

                if (points.length > 1) {
                    requestAnimationFrame(draw);
                } else {
                    running = false;
                    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                }
            }
        })();
    </script>

            }

                if (Math.random() < 0.4) addText(h.x + (Math.random() - 0.5) * Rg, h.y - Rg, pick(['AAAH!', 'HOT!', 'AAAAA!']), '#ff8a65', 28);

            if (p.kind === 'fire') {
                var fa = Math.max(0, 1 - k * k), fr = p.size * (0.55 + k * 1.05);
                ctx.fillStyle = 'rgba(' + fireCol(k) + ',' + (0.8 * fa).toFixed(3) + ')';
                ctx.beginPath(); ctx.arc(0, 0, fr, 0, 7); ctx.fill();
                if (k < 0.5) { ctx.fillStyle = 'rgba(255,255,220,' + (0.7 * (1 - k * 2)).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(0, 0, fr * 0.5, 0, 7); ctx.fill(); }
            } else {
                ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = p.c;
                if (p.kind === 'star') {
                    ctx.rotate(p.rot + now * 0.01); ctx.beginPath();
                    for (var i = 0; i < 8; i++) { var a = i * Math.PI / 4, r = (i % 2 ? 0.45 : 1) * p.size * 1.4; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
                    ctx.closePath(); ctx.fill();
                } else if (p.kind === 'smoke') {
                    ctx.beginPath(); ctx.arc(0, 0, p.size * (2 + k * 5), 0, 7); ctx.fill();
                } else { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, 7); ctx.fill(); }
            }
            ctx.restore();
        });
        fxs.forEach(function (f) { f.draw && f.draw(ctx, Math.min(1, (now - f.t0) / f.dur)); });
        texts.forEach(function (t) {
            var p = (now - t.t0) / 800;
            ctx.save(); ctx.translate(t.x, t.y - p * 40); ctx.rotate(t.rot); ctx.globalAlpha = 1 - p * p;
            var sz = t.size * (0.7 + 0.5 * Math.min(1, p * 6)) * (S > 1 ? 1.1 : 1);
            ctx.font = 'bold ' + sz + 'px "Comic Sans MS","Comic Sans",cursive'; ctx.textAlign = 'center';
            ctx.lineWidth = 7; ctx.strokeStyle = '#222'; ctx.lineJoin = 'round'; ctx.strokeText(t.txt, 0, 0);
            ctx.fillStyle = t.color; ctx.fillText(t.txt, 0, 0); ctx.restore();
        });
        drawBubble(now);
        ctx.restore();
        if (ts < 0.97) {   // slow-mo vignette
            var a = (1 - ts) / 0.75, g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
            g.addColorStop(0, 'rgba(60,90,200,0)'); g.addColorStop(1, 'rgba(30,50,150,' + (0.4 * a).toFixed(3) + ')');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(80,120,255,' + (0.07 * a).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);
        }
    }
    function loop(t) {
        if (!open) return;
        var rdt = lastT ? Math.min(100, t - lastT) : 16; lastT = t;
        update(performance.now(), rdt);
        render();
        raf = requestAnimationFrame(loop);
    }

    /* ============ layout / open / close ============ */
    function resize() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        W = window.innerWidth; H = window.innerHeight;
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        floorY = H - Math.max(96, Math.min(130, H * 0.17));
        var newR = Math.max(26, Math.min(78, (floorY - 70) / 3.45, W * 0.13));
        var changed = Math.abs(newR - Rg) > 0.5 || !pts.length;
        Rg = newR;
        drawBackground();
        if (changed) { buildSim(); items.forEach(function (it) { it.x = clamp(it.x, 30, W - 30); it.y = Math.min(it.y, floorY - 20); }); }
        else { pts.forEach(function (p) { p.x = Math.min(W - p.rad, p.x); }); }
    }
    function resetArena() {
        grab = null; setHint();
        sadUntil = 0; stand = 1; hits = 0; $('arenaHits').textContent = 'hits: 0';
        fxs = []; parts = []; texts = []; items = []; tracers = []; bubble = null; shake = 0; burnUntil = 0; impact = 0;
        buildSim();
        updateCursor();
    }
    function openArena() {
        if (open) return;
        open = true; window.__combatOpen = true;
        arena.hidden = false; document.body.style.overflow = 'hidden';
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (!$('toolbar').children.length) buildToolbar();
        Rg = 0; pts = []; resize(); resetArena();
        window.addEventListener('resize', resize);
        lastT = 0; acc = 0; wasSad = false; ph = [];
        raf = requestAnimationFrame(loop);
        speakBubble('oh no. he\'s got weapons', false, 1800);
        $('arenaExit').focus();
    }
    function closeArena() {
        if (!open) return;
        releaseGrab();
        open = false; window.__combatOpen = false;
        keys.a = keys.d = keys.f = false;
        cancelAnimationFrame(raf);
        window.removeEventListener('resize', resize);
        arena.hidden = true; document.body.style.overflow = '';
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        $('combatBtn').focus();
    }
    buildToolbar();
    setGrav(gravPct);
    setHint();
    window.__combat = {
        open: openArena, close: closeArena,
        _dbg: function () { return { pts: pts, sadUntil: sadUntil, stand: stand, hits: hits, items: items, grab: grab, gt: gt, ts: ts, gravPct: gravPct, burn: burnUntil }; },
        hit: function (x, y) { poke(x, y); },
        _spawn: function (id, x, y, a) { return spawnItem(id, x, y, a); }
    };
})();

</script>
