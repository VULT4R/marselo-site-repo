<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        /* Center all content on the page */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
            background-color: #f0f0f0;
            text-align: center;
        }

        /* Comic Sans font and basic styling for the heading */
        h1 {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            font-size: 3rem;
            margin-bottom: 30px;
            /* Apply the rainbow animation */
            animation: rainbowColors 4s linear infinite;
        }

        /* Keyframes for smooth rainbow color cycling */
        @keyframes rainbowColors {
            0%   { color: #ff0000; } /* Red */
            15%  { color: #ff7f00; } /* Orange */
            30%  { color: #ffff00; } /* Yellow */
            45%  { color: #00ff00; } /* Green */
            60%  { color: #0000ff; } /* Blue */
            75%  { color: #4b0082; } /* Indigo */
            90%  { color: #9400d3; } /* Violet */
            100% { color: #ff0000; } /* Back to Red */
        }

        /* Stretches the image to a 16:9 aspect ratio */
        .stretched-image {
            width: 90vw;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            object-fit: fill; /* Forces the image to stretch and ignore its original proportions */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px; /* Slight rounding for aesthetics */
        }

        /* Canvas that sits on top of the page and draws the cursor trail */
        #trail {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* never blocks clicks */
            z-index: 9999;
        }

        /* ---------- Little guy assistant ---------- */
        #pal {
            position: fixed;
            right: 12px;
            bottom: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            text-align: left;
        }
        #pal button, #pal input { font-family: inherit; }
        #pal :focus-visible { outline: 3px solid #4b0082; outline-offset: 2px; }

        #panel {
            width: min(310px, calc(100vw - 24px));
            max-height: 60vh;
            overflow-y: auto;
            background: #fff;
            border: 3px solid #222;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 4px 4px 0 #222;
        }
        #panel[hidden] { display: none; }
        #panel h2 { margin: 0 0 8px; font-size: 1rem; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .chip {
            border: 2px solid #222;
            background: #fff;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .chip:hover { background: #ffee58; }
        .chip:active { transform: translateY(1px); }
        .say-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .say-row input {
            flex: 1;
            min-width: 0;
            border: 2px solid #222;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.9rem;
        }
        .setting { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; font-size: 0.9rem; }
        .setting input[type="range"] { width: 130px; }
        .setting select { max-width: 170px; font-family: inherit; font-size: 0.85rem; border: 2px solid #222; border-radius: 8px; padding: 3px 4px; background: #fff; }

        #bubble {
            position: relative;
            max-width: 250px;
            background: #fff;
            border: 3px solid #222;
            border-radius: 18px;
            padding: 10px 14px;
            margin-right: 18px;
            font-size: 1rem;
            line-height: 1.35;
            box-shadow: 4px 4px 0 #222;
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px) scale(0.95);
            transform-origin: bottom right;
            transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
            pointer-events: none;
        }
        #bubble.show { opacity: 1; visibility: visible; transform: none; }
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -11px;
            right: 26px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-right: 3px solid #222;
            border-bottom: 3px solid #222;
            transform: rotate(45deg);
        }

        .guy-row { position: relative; }
        #guyBtn {
            display: block;
            width: 110px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            transform-origin: bottom center;
            -webkit-tap-highlight-color: transparent;
        }
        #guyBtn img {
            display: block;
            width: 100%;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: bottom center;
            animation: bob 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25));
        }
        #pal.talking #guyBtn img { animation: yap 0.28s ease-in-out infinite; }
        #guyBtn:hover img { animation: wiggle 0.4s ease-in-out infinite; }
        #guyBtn:active { transform: scale(0.94); }
        #chatToggle {
            position: absolute;
            left: -62px;
            bottom: 10px;
            border: 2px solid #222;
            background: #ffee58;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 0 #222;
        }
        #chatToggle:hover { background: #fff; }

        @keyframes bob    { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
        @keyframes yap    { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.07, 0.93); } }
        @keyframes wiggle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

        @media (max-width: 1100px) {
            body { box-sizing: border-box; padding-bottom: 190px; }
        }
        @media (max-width: 500px) {
            #guyBtn { width: 88px; }
            #chatToggle { left: -58px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #guyBtn img, #pal.talking #guyBtn img, #guyBtn:hover img { animation: none; }
            #bubble { transition: none; }
        }

        /* ---------- Combat mode ---------- */
        #combatBtn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1100;
            border: 3px solid #222;
            background: #ff5252;
            color: #fff;
            border-radius: 999px;
            padding: 8px 16px;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 #222;
        }
        #combatBtn:hover { background: #ff1744; }
        #combatBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #222; }
        #combatBtn:focus-visible { outline: 3px solid #4b0082; outline-offset: 2px; }

        #arena {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: #1a1a2e;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            user-select: none;
            -webkit-user-select: none;
        }
        #arena[hidden] { display: none; }
        #arenaCv {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: none;
            display: block;
        }
        .arena-btn {
            position: absolute;
            top: 12px;
            border: 3px solid #222;
            background: #fff;
            border-radius: 999px;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 #222;
            z-index: 2;
        }
        .arena-btn:hover { background: #ffee58; }
        .arena-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #222; }
        .arena-btn:focus-visible { outline: 3px solid #4b0082; outline-offset: 2px; }
        #arenaExit { left: 12px; background: #ffee58; }
        #arenaReset { right: 12px; }
        #arenaSound { right: 96px; }
        #arenaHits {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 3px solid #222;
            border-radius: 999px;
            padding: 4px 16px;
            font-weight: bold;
            box-shadow: 3px 3px 0 #222;
            pointer-events: none;
            white-space: nowrap;
        }
        #toolbar {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            max-width: calc(100vw - 16px);
            padding: 8px;
            background: rgba(255,255,255,0.92);
            border: 3px solid #222;
            border-radius: 18px;
            box-shadow: 4px 4px 0 #222;

        .tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 74px;
            padding: 4px 2px 3px;

            border-radius: 12px;
            background: #f4f4f4;

            font-size: 0.75rem;
            cursor: pointer;

        .tool canvas { width: 54px; height: 54px; pointer-events: none; }

        .tool.sel { border-color: #ff1744; background: #ffe0e0; }

        @media (max-width: 600px) {
            .tool { width: 52px; font-size: 0.62rem; }
            .tool canvas { width: 38px; height: 38px; }

            #arenaSound { right: 84px; }
            .arena-btn { padding: 5px 10px; font-size: 0.85rem; }
        }
    </style>
</head>

    <script>
        (function () {
            // Skip the effect for people who prefer reduced motion
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            var canvas = document.getElementById('trail');
            var ctx = canvas.getContext('2d');
            var points = [];
            var LIFETIME = 700;   // how long (ms) each trail point lasts
            var MAX_WIDTH = 7;    // thickest part of the trail, near the cursor
            var running = false;

            function resize() {
                var dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            // Works for mouse, pen and touch
            window.addEventListener('pointermove', function (e) {
                points.push({ x: e.clientX, y: e.clientY, t: performance.now() });
                if (!running) {
                    running = true;
                    requestAnimationFrame(draw);
                }
            });

            function draw(now) {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                // Drop points that have faded out
                while (points.length && now - points[0].t > LIFETIME) points.shift();

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (var i = 1; i < points.length; i++) {
                    var a = points[i - 1];
                    var b = points[i];
                    var life = 1 - (now - b.t) / LIFETIME; // 1 = fresh, 0 = gone

                    // Hue is tied to when the point was made, so the colors
                    // run along the trail like a rainbow and keep shifting.
                    var hue = (b.t * 0.35) % 360;

                    ctx.strokeStyle = 'hsla(' + hue + ', 100%, 55%, ' + life + ')';
                    ctx.lineWidth = Math.max(1, MAX_WIDTH * life);
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                }

                if (points.length > 1) {
                    requestAnimationFrame(draw);
                } else {
                    running = false;
                    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                }
            }
        })();
    </script>

            var preferred = [

            }

                clearInterval(typeTimer);
                clearTimeout(hideTimer);

                bubble.classList.add('show');
                bubbleText.textContent = '';

                    i++;

                    if (i >= text.length) {
                        clearInterval(typeTimer);
                        if (!spoke) stopTalking(text.length);
                    }

                clearInterval(typeTimer);

            panel.addEventListener('click', function (e) {

            });

            $('sayForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var input = $('sayInput');
                var text = input.value.trim();
                if (!text) return;

                input.value = '';

            });

            $('optVoice').addEventListener('change', function (e) {

            });
            $('voiceSelect').addEventListener('change', function (e) {

                }

            });
            $('optPitch').addEventListener('input', function (e) { state.pitch = parseFloat(e.target.value); });
            $('optPitch').addEventListener('change', function () { say('testing. testing. is this my voice. colgate'); });
            $('optRate').addEventListener('input', function (e) { state.rate = parseFloat(e.target.value); });
            $('optRate').addEventListener('change', function () { say('this is how fast i talk now. hope you like it'); });

            /* ---------- idle chatter ---------- */
            function idleLoop() {

    function standY() { return floorY - FOOT_BOTTOM * sc; }
    function placeStanding(cx) {
        var hy = standY();

    }

    var stand = 1;              // 0 = limp ragdoll, 1 = standing on his own
    var sadUntil = 0, hits = 0, shake = 0, idleT = 0;
    var wasSad = false;

    function pushAll(vx, vy, w) { pts.forEach(function (p) { p.px -= vx * w; p.py -= vy * w; }); }

    function integrate() {
        var g = GRAV * S;
        for (var i = 0; i < pts.length; i++) {
            var p = pts[i], vx = (p.x - p.px) * 0.9985, vy = (p.y - p.py) * 0.9985;
            p.px = p.x; p.py = p.y;
            p.x += vx; p.y += vy + g;
        }
    }
    function standControl() {
        if (stand <= 0.001) return;
        var k = 0.05 * stand * stand;
        var h = pts[HC];
        var tx = Math.max(Rg * 2.4, Math.min(W - Rg * 2.4, h.x));
        var bob = Math.sin(idleT * 2.2) * 2.5 * sc * 0.6;
        var ty = standY() + bob;
        // straighten up
        var up = { x: pts[TP].x - h.x, y: pts[TP].y - h.y };
        var th = Math.atan2(up.x, -up.y);
        var da = -th * 0.06 * stand * stand, cs = Math.cos(da), sn = Math.sin(da);
        for (var i = 1; i < 6; i++) {
            var p = pts[i], dx = p.x - h.x, dy = p.y - h.y;
            p.x = h.x + dx * cs - dy * sn; p.y = h.y + dx * sn + dy * cs;
        }
        for (i = 0; i < pts.length; i++) {
            p = pts[i];
            var sway = (i >= LE) ? Math.sin(idleT * 2.2 + i) * 1.2 * sc * 0.4 : 0;
            p.x += (tx + p.rx + sway - p.x) * k;
            p.y += (ty + p.ry - p.y) * k;
            var d = 1 - 0.06 * stand;
            p.px = p.x - (p.x - p.px) * d; p.py = p.y - (p.y - p.py) * d;
        }
    }
    function solve() {
        for (var it = 0; it < ITER; it++) {
            for (var c = 0; c < cons.length; c++) {
                var cn = cons[c], a = pts[cn[0]], b = pts[cn[1]];
                var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.0001;
                var diff = (d - cn[2]) / d, wa = 1 / a.m, wb = 1 / b.m, ws = wa + wb;
                a.x += dx * diff * wa / ws; a.y += dy * diff * wa / ws;
                b.x -= dx * diff * wb / ws; b.y -= dy * diff * wb / ws;
            }
            for (c = 0; c < mins.length; c++) {
                var m = mins[c]; a = pts[m[0]]; b = pts[m[1]];
                dx = b.x - a.x; dy = b.y - a.y; d = Math.hypot(dx, dy) || 0.0001;
                if (d < m[2]) {
                    diff = (d - m[2]) / d; wa = 1 / a.m; wb = 1 / b.m; ws = wa + wb;
                    a.x += dx * diff * wa / ws; a.y += dy * diff * wa / ws;
                    b.x -= dx * diff * wb / ws; b.y -= dy * diff * wb / ws;

            collide();
        }

    function collide() {
        var e = 0.5 * 1, thr = 0.6 * S;
        for (var i = 0; i < pts.length; i++) {
            var p = pts[i], r = p.rad, vx = p.x - p.px, vy = p.y - p.py;
            if (p.y > floorY - r) {
                p.y = floorY - r;
                p.py = p.y + (vy > thr ? vy * e : 0);
                p.px = p.x - vx * 0.82;
            }
            if (p.y < r) { p.y = r; p.py = p.y + (vy < -thr ? vy * e : 0); }
            if (p.x < r) { p.x = r; p.px = p.x + (vx < -thr ? vx * 0.6 : 0); }
            if (p.x > W - r) { p.x = W - r; p.px = p.x + (vx > thr ? vx * 0.6 : 0); }
        }
    }

    function drawLimb(name, a, b) {

        drawLimb('legL_lo', LK, LF); drawLimb('legL_up', LHP, LK);
        var f = FRAMES[frameKey('head')], h = pts[HC], t = pts[TP];
        var th = Math.atan2(t.x - h.x, -(t.y - h.y));
        // little squash when freshly hurt
        ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(th); ctx.scale(sc, sc);
        ctx.drawImage(atlas, f.x, f.y, f.w, f.h, f.ox, f.oy, f.w, f.h);
        ctx.restore();
    }
    function drawShadow() {
        var h = pts[HC], height = Math.max(0, floorY - (h.y + Rg));
        var a = Math.max(0.08, 0.32 - height / 900), w = Rg * (1.7 - Math.min(0.6, height / 700));
        ctx.save(); ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
        ctx.beginPath(); ctx.ellipse(h.x, floorY + 4, w, w * 0.2, 0, 0, 7); ctx.fill(); ctx.restore();
    }
    function drawStarStuck(now) {
        stuck = stuck.filter(function (s) { return now - s.t0 < 4200; });
        stuck.forEach(function (s) {
            var x, y;
            if (s.i >= 0) { x = pts[s.i].x + s.ox; y = pts[s.i].y + s.oy; } else { x = s.ox; y = s.oy; }
            var a = Math.min(1, (4200 - (now - s.t0)) / 600);
            ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(s.rot); ctx.scale(S * 0.7, S * 0.7); drawStar(ctx, 22); ctx.restore();
        });
    }
    function drawBubble(now) {
        if (!bubble || now > bubble.until) return;
        var h = pts[HC], txt = bubble.txt;
        var fs = Math.max(14, Math.min(20, W / 28));
        ctx.save(); ctx.font = fs + 'px "Comic Sans MS","Comic Sans",cursive';
        var maxw = Math.min(260, W - 40), words = txt.split(' '), lines = [], cur = '';
        words.forEach(function (w) { var t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxw && cur) { lines.push(cur); cur = w; } else cur = t; });
        lines.push(cur);
        var bw = 0; lines.forEach(function (l) { bw = Math.max(bw, ctx.measureText(l).width); });
        bw += 28; var bh = lines.length * (fs + 4) + 20;
        var bx = Math.max(8, Math.min(W - bw - 8, h.x - bw / 2)), by = Math.max(60, h.y - Rg - bh - 26);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
        var tx = Math.max(bx + 20, Math.min(bx + bw - 20, h.x));
        ctx.beginPath(); ctx.moveTo(tx - 9, by + bh - 1); ctx.lineTo(tx, by + bh + 14); ctx.lineTo(tx + 9, by + bh - 1); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(tx - 9, by + bh); ctx.lineTo(tx, by + bh + 14); ctx.lineTo(tx + 9, by + bh); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillRect(tx - 8, by + bh - 3, 16, 5);
        ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        lines.forEach(function (l, i) { ctx.fillText(l, bx + bw / 2, by + 10 + i * (fs + 4)); });
        ctx.restore();
    }
    function drawGun(now) {
        var g = gunPos(), ang = Math.atan2(ptr.y - g.y, ptr.x - g.x);
        ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(ang);
        if (Math.cos(ang) < 0) ctx.scale(1, -1);
        var recoil = (now - gunFlash < 60) ? -6 : 0;
        ctx.translate(recoil, 0); ctx.scale(S * 0.8, S * 0.8);
        drawAK(ctx);
        if (now - gunFlash < 55) {
            ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.moveTo(136, -3); ctx.lineTo(176, -16); ctx.lineTo(160, -3); ctx.lineTo(180, 6); ctx.lineTo(136, 2); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(140, -2, 7, 0, 7); ctx.fill();
        }
        ctx.restore();
    }
    function drawCursor(now) {
        if (!ptr.in) return;
        ctx.save(); ctx.translate(ptr.x, ptr.y);
        if (tool === 'ak') {
            ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.moveTo(-22, 0); ctx.lineTo(-6, 0); ctx.moveTo(22, 0); ctx.lineTo(6, 0); ctx.moveTo(0, -22); ctx.lineTo(0, -6); ctx.moveTo(0, 22); ctx.lineTo(0, 6); ctx.stroke();
        } else {
            ctx.globalAlpha = 0.95; ctx.scale(S * 0.7, S * 0.7);
            if (tool === 'fist') drawFist(ctx, 52);
            else if (tool === 'star') { ctx.rotate(now * 0.002); drawStar(ctx, 22); }
            else if (tool === 'bat') { ctx.rotate(-0.9); ctx.translate(-20, 0); drawBat(ctx, 150); }
            else if (tool === 'bomb') drawBomb(ctx, false);
            else if (tool === 'sword') { ctx.rotate(-0.9); ctx.translate(-20, 0); drawSword(ctx, 150); }
        }
        ctx.restore();
    }

    /* ============ main loop ============ */
    function update(now, dtMs) {
        idleT += dtMs / 1000;
        // mood
        var sad = now < sadUntil;
        if (wasSad && !sad) { speakBubble(pick(LINES.back), false, 2200); }
        wasSad = sad;
        if (!sad && stand < 1) stand = Math.min(1, stand + dtMs / 1300);
        // fixed-step physics
        acc += Math.min(dtMs, 50) / 1000;
        while (acc >= STEP) { integrate(); standControl(); solve(); acc -= STEP; }
        // fx impacts
        fxs.forEach(function (f) {
            var p = (now - f.t0) / f.dur;
            if (!f.hit && p >= f.imp) { f.hit = true; if (f.onImpact) f.onImpact(); }
            if (p >= 1) f.done = true;
        });
        // bombs
        bombs.forEach(function (b) {
            var dt = dtMs / 1000;
            b.vy += 1900 * S * dt; b.x += b.vx * dt; b.y += b.vy * dt;
            var r = 18 * S;
            if (b.y > floorY - r) { b.y = floorY - r; b.vy *= -0.4; b.vx *= 0.7; if (Math.abs(b.vy) < 40) b.vy = 0; }
            if (b.x < r) { b.x = r; b.vx *= -0.5; } if (b.x > W - r) { b.x = W - r; b.vx *= -0.5; }
            var left = b.fuse - (now - b.t0);
            var every = left < 500 ? 120 : 280;
            if (now - b.last > every) { b.last = now; SFX.tick(); }
            if (left <= 0) { b.dead = true; explode(b); }
        });
        bombs = bombs.filter(function (b) { return !b.dead; });
        // rapid fire
        if (firing && tool === 'ak' && now - lastShot > 85) { lastShot = now; shoot(now); }
        // particles
        var dt = dtMs / 1000;
        parts.forEach(function (p) {
            p.vy += p.g * 60 * dt * S * 0.35; p.x += p.vx * 60 * dt; p.y += p.vy * 60 * dt;
            if (p.kind === 'smoke') { p.vx *= 0.97; p.vy = p.vy * 0.97 - 0.02; }
        });
        parts = parts.filter(function (p) { return now - p.t0 < p.life; });
        texts = texts.filter(function (t) { return now - t.t0 < 800; });
        tracers = tracers.filter(function (t) { return now - t.t0 < 70; });
        fxs = fxs.filter(function (f) { return !f.done; });
        shake *= Math.pow(0.001, dt);
    }

    function render(now) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        ctx.drawImage(bgCanvas, 0, 0, W, H);
        drawShadow();
        bombs.forEach(function (b) {
            ctx.save(); ctx.translate(b.x, b.y); ctx.scale(S * 1.05, S * 1.05); drawBomb(ctx, true, now); ctx.restore();
        });
        drawMarselo();
        drawStarStuck(now);
        // tracers
        tracers.forEach(function (t) {
            ctx.strokeStyle = 'rgba(255,240,150,' + (1 - (now - t.t0) / 70) + ')'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(t.x0, t.y0); ctx.lineTo(t.x1, t.y1); ctx.stroke();
        });
        // particles
        parts.forEach(function (p) {
            var k = 1 - (now - p.t0) / p.life; ctx.save(); ctx.globalAlpha = Math.max(0, k); ctx.fillStyle = p.c; ctx.translate(p.x, p.y);
            if (p.kind === 'star') {
                ctx.rotate(p.rot + now * 0.01); ctx.beginPath();
                for (var i = 0; i < 8; i++) { var a = i * Math.PI / 4, r = (i % 2 ? 0.45 : 1) * p.size * 1.4; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
                ctx.closePath(); ctx.fill();
            } else if (p.kind === 'smoke') {
                ctx.beginPath(); ctx.arc(0, 0, p.size * (2 + (1 - k) * 5), 0, 7); ctx.fill();
            } else { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, 7); ctx.fill(); }
            ctx.restore();
        });
        fxs.forEach(function (f) { f.draw && f.draw(ctx, Math.min(1, (now - f.t0) / f.dur)); });
        if (tool === 'ak') drawGun(now);
        // floating words
        texts.forEach(function (t) {
            var p = (now - t.t0) / 800;
            ctx.save(); ctx.translate(t.x, t.y - p * 40); ctx.rotate(t.rot); ctx.globalAlpha = 1 - p * p;
            var sz = t.size * (0.7 + 0.5 * Math.min(1, p * 6)) * (S > 1 ? 1.1 : 1);
            ctx.font = 'bold ' + sz + 'px "Comic Sans MS","Comic Sans",cursive'; ctx.textAlign = 'center';
            ctx.lineWidth = 7; ctx.strokeStyle = '#222'; ctx.lineJoin = 'round'; ctx.strokeText(t.txt, 0, 0);
            ctx.fillStyle = t.color; ctx.fillText(t.txt, 0, 0); ctx.restore();
        });
        drawBubble(now);
        ctx.restore();
        drawCursor(now);
    }
    function loop(t) {
        if (!open) return;
        var dtMs = lastT ? t - lastT : 16; lastT = t;
        var now = performance.now();
        update(now, dtMs);
        render(now);
        raf = requestAnimationFrame(loop);
    }

    /* ============ layout / open / close ============ */
    function resize() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        W = window.innerWidth; H = window.innerHeight;
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        floorY = H - Math.max(96, Math.min(130, H * 0.17));
        var newR = Math.max(26, Math.min(78, (floorY - 70) / 3.45, W * 0.13));
        var changed = Math.abs(newR - Rg) > 0.5 || !pts.length;
        Rg = newR;
        drawBackground();
        if (changed) buildSim(); else { pts.forEach(function (p) { p.x = Math.min(W - p.rad, p.x); }); }
    }
    function resetArena() {
        sadUntil = 0; stand = 1; hits = 0; $('arenaHits').textContent = 'hits: 0';
        fxs = []; parts = []; texts = []; stuck = []; bombs = []; tracers = []; bubble = null; shake = 0;
        buildSim();
    }
    function openArena() {
        if (open) return;
        open = true; window.__combatOpen = true;
        arena.hidden = false; document.body.style.overflow = 'hidden';
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (!$('toolbar').children.length) buildToolbar();
        Rg = 0; pts = []; resize(); resetArena();
        window.addEventListener('resize', resize);
        lastT = 0; acc = 0; wasSad = false;
        raf = requestAnimationFrame(loop);
        speakBubble('oh no. he\'s got weapons', false, 1800);
        $('arenaExit').focus();
    }
    function closeArena() {
        if (!open) return;
        open = false; window.__combatOpen = false; firing = false;
        cancelAnimationFrame(raf);
        window.removeEventListener('resize', resize);
        arena.hidden = true; document.body.style.overflow = '';
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        $('combatBtn').focus();
    }
    buildToolbar();
    window.__combat = { open: openArena, close: closeArena, _dbg: function () { return { pts: pts, sadUntil: sadUntil, stand: stand, hits: hits, tool: tool }; }, hit: function (x, y) { attack(x, y); } };
})();

    </script>
